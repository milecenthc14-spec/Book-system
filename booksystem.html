<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Search System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* Main Container */
        .search-container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        /* Title */
        .search-container h1 {
            margin-bottom: 25px;
            color: #333;
        }

        /* Search Bar */
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #searchInput {
            width: 500px;
            max-width: 70%;
            padding: 14px 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #555;
        }

        /* Search Button */
        #searchBtn {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #searchBtn:hover {
            background: #555;
        }

        /* Loading */
        #loading {
            color: #555;
            margin-top: 20px;
        }

        /* Error */
        #error {
            color: red;
            margin-top: 15px;
        }

        /* Results */
        #results {
            margin-top: 30px;
            text-align: left;
        }

        /* Book Result */
        .book {
            display: flex;
            gap: 20px;
            padding: 20px;
            margin-bottom: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .book:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .book img {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            background: #ddd;
        }

        .book h3 {
            margin-top: 0;
            color: #333;
        }

        .book p {
            color: #555;
        }

        .click-text {
            color: #777;
            font-size: 13px;
        }

        /* =========================
           BOOK INFORMATION MODAL
           ========================= */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            overflow-y: auto;
            padding: 30px 15px;
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Close Button */
        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 32px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
        }

        .close:hover {
            color: red;
        }

        /* Book Details */
        .book-details {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }

        .book-details img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .details-info {
            flex: 1;
        }

        .details-info h2 {
            margin-top: 0;
            font-size: 28px;
            color: #222;
        }

        .details-info p {
            line-height: 1.6;
        }

        .description {
            margin-top: 25px;
            line-height: 1.7;
        }

        .description h3 {
            color: #333;
        }

        .subjects {
            margin-top: 15px;
        }

        .subject {
            display: inline-block;
            background: #eee;
            padding: 6px 10px;
            margin: 4px;
            border-radius: 15px;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .search-box {
                flex-direction: column;
            }

            #searchInput {
                width: 100%;
                max-width: 100%;
            }

            #searchBtn {
                width: 100%;
            }

            .book {
                flex-direction: column;
            }

            .book img {
                width: 120px;
                height: 180px;
            }

            .book-details {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .book-details img {
                width: 180px;
                height: 270px;
            }

            .details-info {
                width: 100%;
            }

            .modal-content {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         SEARCH AREA
         ========================= -->

    <div class="search-container">

        <h1>📚 Book Search System</h1>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for a book title..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <p id="loading" style="display: none;">
            Searching for books...
        </p>

        <p id="error"></p>

        <div id="results"></div>

    </div>


    <!-- =========================
         BOOK INFORMATION MODAL
         ========================= -->

    <div id="bookModal" class="modal">

        <div class="modal-content">

            <span class="close" id="closeModal">
                &times;
            </span>

            <div id="bookDetails">
                Loading book information...
            </div>

        </div>

    </div>


    <script>

        // =========================
        // GET HTML ELEMENTS
        // =========================

        const searchInput =
            document.getElementById("searchInput");

        const searchBtn =
            document.getElementById("searchBtn");

        const resultsDiv =
            document.getElementById("results");

        const loadingDiv =
            document.getElementById("loading");

        const errorDiv =
            document.getElementById("error");

        const bookModal =
            document.getElementById("bookModal");

        const bookDetails =
            document.getElementById("bookDetails");

        const closeModal =
            document.getElementById("closeModal");


        // =========================
        // SEARCH BUTTON
        // =========================

        searchBtn.addEventListener(
            "click",
            searchBooks
        );


        // =========================
        // ENTER KEY
        // =========================

        searchInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    searchBooks();
                }

            }
        );


        // =========================
        // SEARCH BOOKS
        // =========================

        async function searchBooks() {

            const query =
                searchInput.value.trim();


            // Check empty search
            if (!query) {

                errorDiv.textContent =
                    "Please enter a book title.";

                resultsDiv.innerHTML = "";

                return;
            }


            // Show loading
            loadingDiv.style.display = "block";

            errorDiv.textContent = "";

            resultsDiv.innerHTML = "";


            try {

                // Open Library Search API
                const url =
                    `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=10`;


                const response =
                    await fetch(url);


                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }


                const data =
                    await response.json();


                displayResults(data.docs);


            } catch (error) {

                errorDiv.textContent =
                    "Something went wrong. Please try again.";

            } finally {

                loadingDiv.style.display = "none";

            }

        }


        // =========================
        // DISPLAY SEARCH RESULTS
        // =========================

        function displayResults(books) {

            if (!books || books.length === 0) {

                resultsDiv.innerHTML =
                    '<p style="color:#888;">No books found. Try a different title.</p>';

                return;
            }


            books.forEach(function(book) {

                const title =
                    book.title || "Unknown Title";


                const author =
                    book.author_name
                        ? book.author_name.join(", ")
                        : "Unknown Author";


                const year =
                    book.first_publish_year ||
                    "Unknown";


                const coverId =
                    book.cover_i;


                const coverImg =
                    coverId
                        ? `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`
                        : "";


                // Open Library work ID
                const workId =
                    book.key;


                // Create book result
                const bookDiv =
                    document.createElement("div");


                bookDiv.className = "book";


                bookDiv.innerHTML = `

                    ${
                        coverImg
                        ? `<img
                            src="${coverImg}"
                            alt="${title} cover"
                          >`
                        : `<div
                            style="
                            width:100px;
                            height:150px;
                            background:#ddd;
                            border-radius:5px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            ">
                            No Cover
                          </div>`
                    }

                    <div>

                        <h3>${title}</h3>

                        <p>
                            <strong>Author:</strong>
                            ${author}
                        </p>

                        <p>
                            <strong>First Published:</strong>
                            ${year}
                        </p>

                        <p class="click-text">
                            🔍 Click this book to see more information
                        </p>

                    </div>

                `;


                // Click book
                bookDiv.addEventListener(
                    "click",
                    function() {

                        openBook(
                            workId,
                            title,
                            author,
                            year,
                            coverId
                        );

                    }
                );


                resultsDiv.appendChild(bookDiv);

            });

        }


        // =========================
        // OPEN BOOK INFORMATION
        // =========================

        async function openBook(
            workId,
            title,
            author,
            year,
            coverId
        ) {

            // Show modal
            bookModal.style.display = "block";


            // Show loading
            bookDetails.innerHTML = `
                <p style="text-align:center;">
                    Loading book information...
                </p>
            `;


            try {

                /*
                 * Example key:
                 * /works/OL45804W
                 *
                 * We remove unnecessary parts
                 * and create the API URL.
                 */

                const workKey =
                    workId.replace(
                        "/works/",
                        ""
                    );


                // Get detailed book information
                const response =
                    await fetch(
                        `https://openlibrary.org/works/${workKey}.json`
                    );


                if (!response.ok) {
                    throw new Error(
                        "Book information unavailable"
                    );
                }


                const data =
                    await response.json();


                // Description
                let description =
                    "No description available.";


                if (data.description) {

                    if (
                        typeof data.description ===
                        "string"
                    ) {

                        description =
                            data.description;

                    } else if (
                        data.description.value
                    ) {

                        description =
                            data.description.value;

                    }

                }


                // Subjects
                let subjectsHTML = "";


                if (
                    data.subjects &&
                    data.subjects.length > 0
                ) {

                    const subjects =
                        data.subjects.slice(0, 15);


                    subjectsHTML =
                        subjects.map(
                            function(subject) {

                                return `
                                    <span class="subject">
                                        ${subject}
                                    </span>
                                `;

                            }
                        ).join("");

                } else {

                    subjectsHTML =
                        "No subjects available.";

                }


                // Cover
                const cover =
                    coverId
                    ? `https://covers.openlibrary.org/b/id/${coverId}-L.jpg`
                    : "";


                // Display details
                bookDetails.innerHTML = `

                    <div class="book-details">

                        ${
                            cover
                            ? `<img
                                src="${cover}"
                                alt="${title} cover"
                              >`
                            : `<div
                                style="
                                width:200px;
                                height:300px;
                                background:#ddd;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                border-radius:8px;
                                ">
                                No Cover
                              </div>`
                        }

                        <div class="details-info">

                            <h2>
                                ${title}
                            </h2>

                            <p>
                                <strong>Author:</strong>
                                ${author}
                            </p>

                            <p>
                                <strong>First Published:</strong>
                                ${year}
                            </p>

                            <p>
                                <strong>Open Library ID:</strong>
                                ${workId}
                            </p>

                        </div>

                    </div>


                    <div class="description">

                        <h3>
                            📖 Description
                        </h3>

                        <p>
                            ${description}
                        </p>

                    </div>


                    <div class="subjects">

                        <h3>
                            🏷️ Subjects
                        </h3>

                        ${subjectsHTML}

                    </div>

                `;


            } catch (error) {

                // If detailed information fails,
                // still show basic information

                bookDetails.innerHTML = `

                    <h2>${title}</h2>

                    <p>
                        <strong>Author:</strong>
                        ${author}
                    </p>

                    <p>
                        <strong>First Published:</strong>
                        ${year}
                    </p>

                    <p style="color:red;">
                        More information could not
                        be loaded.
                    </p>

                `;

            }

        }


        // =========================
        // CLOSE MODAL
        // =========================

        closeModal.addEventListener(
            "click",
            function() {

                bookModal.style.display = "none";

            }
        );


        // =========================
        // CLOSE WHEN CLICKING
        // OUTSIDE THE MODAL
        // =========================

        window.addEventListener(
            "click",
            function(event) {

                if (event.target === bookModal) {

                    bookModal.style.display = "none";

                }

            }
        );


        // =========================
        // ESC KEY CLOSE
        // =========================

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    bookModal.style.display =
                        "none";

                }

            }
        );

    </script>

</body>
</html>
```
